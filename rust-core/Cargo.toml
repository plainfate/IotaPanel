[package]
name = "iotapanel-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
http-body-util = "0.1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
pbkdf2 = "0.12"
hex = "0.4"
subtle = "2"
getrandom = "0.2"
url = "2"