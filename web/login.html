<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>登录 · IotaPanel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-brand">
    <img src="/favicon.svg" alt="IotaPanel" class="auth-logo">
    <h1 class="auth-title">IotaPanel</h1>
    <p class="auth-sub" id="auth-sub">登录以管理您的设备面板</p>
  </div>
  <form id="login-form" autocomplete="on">
    <label class="field">
      <span class="field-label">用户名</span>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span class="field-label">密码</span>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>
    <label class="check-row">
      <input type="checkbox" id="remember">
      <span>保持登录 30 天</span>
    </label>
    <div class="form-error" id="form-error" hidden></div>
    <button type="submit" class="btn primary full" id="login-btn">登 录</button>
  </form>
  <footer class="auth-foot">IotaPanel v<span id="auth-ver"></span></footer>
</div>
<script>
// 登录页直接内联最小逻辑（不依赖 hash 路由）
document.addEventListener('DOMContentLoaded', async () => {
  const f = document.getElementById('login-form');
  const err = document.getElementById('form-error');
  const btn = document.getElementById('login-btn');
  const ver = document.getElementById('auth-ver');
  try {
    const s = await (await fetch('/api/status')).json();
    if (s.version) ver.textContent = s.version;
  } catch {}
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          remember: document.getElementById('remember').checked
        })
      });
      if (r.redirected || r.ok) {
        window.location.href = '/';
        return;
      }
      const j = await r.json();
      err.textContent = j.error || '登录失败';
      err.hidden = false;
    } catch (ex) {
      err.textContent = '网络错误: ' + ex.message;
      err.hidden = false;
    }
    btn.disabled = false; btn.textContent = '登 录';
  });
});
</script>
</body>
</html>
