name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilers
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          elif [[ "${{ matrix.target }}" == armv7-* ]]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf
          fi

      - name: Build (release)
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) export RUSTFLAGS="-C linker=aarch64-linux-gnu-gcc";;
            armv7-*)   export RUSTFLAGS="-C linker=arm-linux-gnueabihf-gcc";;
          esac
          ./build.sh

      - name: Smoke test (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          bin/iotapanel version
          bin/iotapanel help

      - uses: actions/upload-artifact@v4
        with:
          name: iotapanel-${{ matrix.target }}
          path: |
            bin/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p dist
          for d in artifacts/*; do
            tgt=$(basename "$d")
            tar -czf "dist/iotapanel-$tgt.tar.gz" -C "$d" .
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true