[workspace]
resolver = "2"
members = [
    "sdk",
    "core",
    "plugins/hello",
    "plugins/resource-monitor",
    "plugins/terminal",
    "plugins/https-front",
    "plugins/mcp-agent",
    # plugins/file-manager 已移除（被 disk-manager 替代，仅作历史存档保留在 plugins/.deprecated/）
]

[profile.dev]
panic = "abort"

incremental = false
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
