[package]
name = "iotapanel-core"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "iotapanel"
path = "src/main.rs"

[dependencies]
iotapanel-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hex = "0.4"
base64 = "0.22"
subtle = "2"
getrandom = "0.2"
flate2 = "1"
tar = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

