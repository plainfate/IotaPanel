  登录页：提交用户名密码到 /api/login，成功后跳转主界面（支持 18 种语言）
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IotaPanel</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <!-- 语言切换 -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
      <select id="lang-select" style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted);outline:none"></select>
    </div>
    <div class="brand-big"><span>☁️</span> IotaPanel</div>
    <div class="auth-sub" data-i18n="abSub"></div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username" data-i18n="lgUsername"></label>
        <input class="input" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password" data-i18n="lgPassword"></label>
        <input class="input" type="password" id="password" name="password" required>
      </div>
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:14px;cursor:pointer">
        <input type="checkbox" id="remember" style="accent-color:var(--accent);width:15px;height:15px">
        <span data-i18n="lgRemember"></span>
      </label>
      <div class="error-text" id="login-error"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit" id="login-btn" data-i18n="lgBtn"></button>
    </form>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script>
// 语言选择器
(function () {
  const sel = document.getElementById('lang-select');
  I18N_LANGS.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.code; opt.textContent = l.name;
    sel.appendChild(opt);
  });
  sel.value = document.documentElement.lang;
  sel.addEventListener('change', () => setLang(sel.value));
})();

// 提交登录表单
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = t('lgBtn');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        remember: document.getElementById('remember').checked,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || t('lgBtn'));
    location.href = '/'; // 登录成功进入主界面
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = t('lgBtn');
  }
});
</script>
</body>
</html>
